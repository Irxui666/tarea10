app:
  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: 60
server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: false

    database-platform: org.hibernate.dialect.OracleDialect
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false